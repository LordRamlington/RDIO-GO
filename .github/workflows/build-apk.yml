name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions web tab

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: |
          npm run build

      - name: Setup Native Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Native Service, Permissions & Files
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            for PERM in \
              "android.permission.INTERNET" \
              "android.permission.WAKE_LOCK" \
              "android.permission.ACCESS_NETWORK_STATE" \
              "android.permission.ACCESS_WIFI_STATE" \
              "android.permission.FOREGROUND_SERVICE" \
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" \
              "android.permission.POST_NOTIFICATIONS" \
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"; do
              if ! grep -q "$PERM" "$MANIFEST_PATH"; then
                sed -i "/<manifest/a \    <uses-permission android:name=\"$PERM\" />" "$MANIFEST_PATH"
              fi
            done
            # Allow cleartext HTTP audio streams for international radio feeds
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"
            # Register native RadioPlaybackService with mediaPlayback foregroundServiceType
            if ! grep -q "RadioPlaybackService" "$MANIFEST_PATH"; then
              sed -i '/<\/application>/i \        <service android:name="com.cuveyapps.rdiogo.RadioPlaybackService" android:foregroundServiceType="mediaPlayback" android:exported="false" />' "$MANIFEST_PATH"
            fi
          fi

          # Copy native Java source files into Android app package
          TARGET_JAVA_DIR="android/app/src/main/java/com/cuveyapps/rdiogo"
          mkdir -p "$TARGET_JAVA_DIR"
          cp android-native/MainActivity.java "$TARGET_JAVA_DIR/MainActivity.java"
          cp android-native/RadioPlaybackService.java "$TARGET_JAVA_DIR/RadioPlaybackService.java"

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Configure Version Code and Version Name
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" "$BUILD_GRADLE"
            sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" "$BUILD_GRADLE"
          fi

      - name: Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./RDIO-GO.apk

      - name: Generate Release Keystore and Build Signed App Bundle (.aab) for Google Play
        run: |
          KEYSTORE="release.keystore"
          ALIAS="rdiogo"
          STOREPASS="rdio_go_production_key_2026"

          # Generate 2048-bit RSA release signing key
          keytool -genkey -v -keystore "$KEYSTORE" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -dname "CN=RDIO-GO, OU=App, O=RDIO-GO, L=London, ST=London, C=GB"

          # Compile Android App Bundle
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace
          cd ..

          # Sign the App Bundle with jarsigner
          AAB_FILE=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE" -storepass "$STOREPASS" -keypass "$STOREPASS" \
              "$AAB_FILE" "$ALIAS"
            cp "$AAB_FILE" ./RDIO-GO.aab
          fi

      - name: Upload APK and AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RDIO-GO-Release-Assets
          path: |
            ./RDIO-GO.apk
            ./RDIO-GO.aab
            ./release.keystore
          if-no-files-found: warn

      - name: Publish Direct APK & Google Play AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0-latest
          name: "RDIO-GO Android APK & Play Store Bundle (v1.${{ github.run_number }})"
          body: |
            ### RDIO-GO Android Production Release Assets
            - **Google Play Store**: Download `RDIO-GO.aab` and upload directly to [Google Play Console](https://play.google.com/console).
            - **Direct Phone Test**: Download `RDIO-GO.apk` to test directly on your Android phone.
          files: |
            ./RDIO-GO.apk
            ./RDIO-GO.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
