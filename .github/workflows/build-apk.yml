name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions web tab

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: |
          npm run build

      - name: Setup Native Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Native Service, Permissions & Files
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            for PERM in \
              "android.permission.INTERNET" \
              "android.permission.WAKE_LOCK" \
              "android.permission.ACCESS_NETWORK_STATE" \
              "android.permission.ACCESS_WIFI_STATE" \
              "android.permission.FOREGROUND_SERVICE" \
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" \
              "android.permission.POST_NOTIFICATIONS"; do
              if ! grep -q "$PERM" "$MANIFEST_PATH"; then
                sed -i "/<manifest/a \    <uses-permission android:name=\"$PERM\" />" "$MANIFEST_PATH"
              fi
            done
            # Allow cleartext HTTP audio streams for international radio feeds
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"
            # Register native RadioPlaybackService with mediaPlayback foregroundServiceType
            if ! grep -q "RadioPlaybackService" "$MANIFEST_PATH"; then
              sed -i '/<\/application>/i \        <service android:name="com.rdiogo.app.RadioPlaybackService" android:foregroundServiceType="mediaPlayback" android:exported="false" />' "$MANIFEST_PATH"
            fi
          fi

          # Copy native Java source files into Android app package
          TARGET_JAVA_DIR="android/app/src/main/java/com/rdiogo/app"
          mkdir -p "$TARGET_JAVA_DIR"
          cp android-native/MainActivity.java "$TARGET_JAVA_DIR/MainActivity.java"
          cp android-native/RadioPlaybackService.java "$TARGET_JAVA_DIR/RadioPlaybackService.java"

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./RDIO-GO.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RDIO-GO-Android-APK
          path: ./RDIO-GO.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases (No Zip)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0-latest
          name: "RDIO-GO Android APK (Direct Download)"
          body: |
            ### Direct Android APK Download
            Click the `RDIO-GO.apk` link below to download the actual APK directly to your phone without any zip file.
          files: ./RDIO-GO.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
